name: Build and Publish Container Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ develop, testing, main ]
    paths:
      - .github/workflows/docker-publish.yml
      - scripts/verify-container-candidate.sh
      - scripts/assemble-container-index.sh
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Run native builds and checks without publishing images or tags
        required: false
        default: false
        type: boolean
      publish_dockerhub_validation:
        description: Publish and smoke-test an explicitly tagged Docker Hub validation image
        required: false
        default: false
        type: boolean
      verify_release_tag:
        description: Verify an existing stable release tag without rebuilding it
        required: false
        default: ''
        type: string

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/nodecast-tv-plus
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/nodecast-tv-plus

jobs:
  build-platform:
    if: github.event_name != 'workflow_dispatch' || inputs.verify_release_tag == ''
    name: Native container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify release metadata
        run: node scripts/release-check.js

      - name: Verify native runner architecture
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate Docker Hub release configuration
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation)) && !inputs.validate_only
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::DOCKERHUB_NAMESPACE must contain a valid lowercase Docker Hub namespace."
            exit 1
          fi

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub release credentials are not configured."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && !inputs.validate_only
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract GHCR metadata
        id: ghcr_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Build native candidate without publishing tags
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          pull: true
          build-args: |
            RUNTIME_REFRESH=publish-${{ github.run_id }}-${{ github.run_attempt }}
            NODECAST_REVISION=${{ github.sha }}
          tags: nodecast-tv-plus:native
          labels: ${{ steps.ghcr_meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-${{ matrix.arch }},mode=max

      - name: Verify native runtime and container health
        shell: bash
        env:
          CANDIDATE_IMAGE: nodecast-tv-plus:native
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: scripts/verify-container-candidate.sh

      - name: Block fixable high and critical runtime vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --pkg-types os --ignore-unfixed \
            --severity CRITICAL,HIGH --exit-code 1 --no-progress \
            --quiet --format json --output /tmp/runtime-scan.json \
            nodecast-tv-plus:native

      - name: Select digest destinations
        if: github.event_name != 'pull_request' && !inputs.validate_only
        id: destinations
        shell: bash
        env:
          MIRROR_IMAGE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation) }}
        run: |
          images="${GHCR_IMAGE,,}"
          if [ "$MIRROR_IMAGE" = "true" ]; then
            images="$images,${DOCKERHUB_IMAGE,,}"
          fi
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

      - name: Export verified platform by digest
        if: github.event_name != 'pull_request' && !inputs.validate_only
        id: export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RUNTIME_REFRESH=publish-${{ github.run_id }}-${{ github.run_attempt }}
            NODECAST_REVISION=${{ github.sha }}
          labels: ${{ steps.ghcr_meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.destinations.outputs.images }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min

      - name: Record platform digest
        if: github.event_name != 'pull_request' && !inputs.validate_only
        shell: bash
        env:
          PLATFORM_DIGEST: ${{ steps.export.outputs.digest }}
          PLATFORM_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$PLATFORM_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$PLATFORM_DIGEST" > "$RUNNER_TEMP/digests/$PLATFORM_ARCH"

      - name: Upload platform digest
        if: github.event_name != 'pull_request' && !inputs.validate_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish-index:
    if: github.event_name != 'pull_request' && !inputs.validate_only && (github.event_name != 'workflow_dispatch' || inputs.verify_release_tag == '')
    needs: build-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation)) && !inputs.validate_only
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download verified platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Extract GHCR metadata
        id: ghcr_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Extract Docker Hub release metadata
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation)
        id: dockerhub_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=validation-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation }}

      - name: Assemble and verify combined registry images
        shell: bash
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          GHCR_METADATA: ${{ steps.ghcr_meta.outputs.json }}
          DOCKERHUB_METADATA: ${{ steps.dockerhub_meta.outputs.json }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: scripts/assemble-container-index.sh

      - name: Verify Docker Hub validation image
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub_validation
        shell: bash
        run: |
          set -euo pipefail

          image="${DOCKERHUB_IMAGE}:validation-${GITHUB_SHA}"
          platforms="$(docker buildx imagetools inspect "$image" --raw \
            | jq -r '.manifests[]
              | select(.platform.os == "linux")
              | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
              | "\(.platform.os)/\(.platform.architecture)"' \
            | sort)"
          diff -u <(printf 'linux/amd64\nlinux/arm64\n') <(printf '%s\n' "$platforms")

          docker pull --platform linux/amd64 "$image"
          jwt_secret="$(openssl rand -hex 48)"
          session_secret="$(openssl rand -hex 48)"
          container_id="$(docker run -d --name nodecast-dockerhub-validation \
            -e NODE_ENV=production \
            -e JWT_SECRET="$jwt_secret" \
            -e SESSION_SECRET="$session_secret" \
            -p 127.0.0.1::3000 \
            "$image")"
          trap 'docker rm -f nodecast-dockerhub-validation >/dev/null 2>&1 || true' EXIT

          for attempt in {1..40}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          host_port="$(docker port "$container_id" 3000/tcp | awk -F: '{print $NF}')"
          curl -fsS "http://127.0.0.1:${host_port}/api/health" | grep -q '"status":"ok"'

      - name: Verify mirrored release tags
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: scripts/verify-container-release.sh

  verify-existing-release:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate release verification configuration
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.verify_release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::verify_release_tag must be a stable semantic version such as v2.5.0."
            exit 1
          fi

          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::DOCKERHUB_NAMESPACE must contain a valid lowercase Docker Hub namespace."
            exit 1
          fi

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub release credentials are not configured."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify mirrored release tags
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.verify_release_tag }}
        run: scripts/verify-container-release.sh
