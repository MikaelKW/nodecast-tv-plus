name: CI

on:
  pull_request:
    branches: [develop, testing, main]
  push:
    branches: [develop, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run application checks
        run: npm test

      - name: Install browsers for integration tests
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser and media integration tests
        run: npm run test:e2e

      - name: Run mobile WebKit layout tests
        run: npm run test:e2e:mobile

      - name: Run reverse-proxy subpath tests
        run: npm run test:e2e:subpath

      - name: Upload browser test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high --omit=dev --package-lock-only

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: application-checks

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: nodecast-tv-plus:ci
          pull: true
          build-args: |
            RUNTIME_REFRESH=ci-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime-only image contents
        shell: bash
        run: |
          docker run --rm --entrypoint sh nodecast-tv-plus:ci -eu -c '
            for command in node ffmpeg ffprobe python3 curl; do
              command -v "$command" >/dev/null
            done

            for command in npm npx corepack make gcc g++; do
              if command -v "$command" >/dev/null; then
                echo "Unexpected build command in runtime image: $command"
                exit 1
              fi
            done

            for package in linux-libc-dev libc6-dev make g++; do
              if dpkg-query -s "$package" >/dev/null 2>&1; then
                echo "Unexpected build package in runtime image: $package"
                exit 1
              fi
            done

            node -e "require(\"better-sqlite3\"); require(\"ffmpeg-static\")"
          '

      - name: Block fixable high and critical runtime vulnerabilities
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image \
            --scanners vuln \
            --pkg-types os \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --no-progress \
            nodecast-tv-plus:ci

      - name: Verify container health
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 48)"
          session_secret="$(openssl rand -hex 48)"
          container_id="$(docker run -d --name nodecast-health-ci \
            -e NODE_ENV=production \
            -e JWT_SECRET="$jwt_secret" \
            -e SESSION_SECRET="$session_secret" \
            -p 127.0.0.1::3000 \
            nodecast-tv-plus:ci)"
          trap 'docker rm -f nodecast-health-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..40}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          host_port="$(docker port "$container_id" 3000/tcp | awk -F: '{print $NF}')"
          curl -fsS "http://127.0.0.1:${host_port}/api/health" | grep -q '"status":"ok"'

      - name: Verify upstream migration compatibility
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        run: npm run test:migration
        env:
          NODECAST_MIGRATION_CANDIDATE_IMAGE: nodecast-tv-plus:ci
